<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renal QBank &mdash; Quiz</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="skins.css" />
  <script defer src="https://activetransport.app/static/tool-track.js"></script>
  <script src="skins.js"></script>
  <script>ATSkin.restore();</script>
</head>
<body>
  <header class="quiz-header">
    <div class="container quiz-header-row">
      <div class="quiz-header-left">
        <a href="index.html" class="back-link" aria-label="Back to bricks">&larr; Bricks</a>
        <div>
          <div class="quiz-brick-title-row">
            <span id="brick-title" class="quiz-brick-title">Loading&hellip;</span>
          </div>
          <div id="question-counter" class="quiz-counter"></div>
        </div>
      </div>
      <span id="exam-score" class="exam-score" aria-live="polite"></span>
      <div id="score-badge" class="score-badge" aria-live="polite">
        <span class="score-label">Score</span>
        <span id="score-fraction" class="score-fraction">0/0</span>
        <span id="score-percent" class="score-percent">&mdash;</span>
      </div>
    </div>
  </header>

  <main class="container quiz-main">
    <div id="exam-itembar" class="exam-itembar">
      <span id="exam-itemno" class="exam-itemno"></span>
      <button id="exam-flag" class="exam-flag" type="button"></button>
      <span class="exam-more" aria-hidden="true">&bull;&bull;&bull;</span>
    </div>
    <div id="question-area"></div>
    <div class="palette-rail">
      <span class="palette-head">FILTER &rsaquo;</span>
      <span class="palette-chev" data-dir="up" aria-hidden="true"></span>
      <div id="palette" class="palette" aria-label="Question navigation"></div>
      <span class="palette-chev" data-dir="down" aria-hidden="true"></span>
    </div>
    <div class="quiz-actions">
      <button id="reset-brick" class="btn btn-ghost btn-small" type="button">Reset brick</button>
    </div>
  </main>

  <div id="examfoot" class="examfoot">
    <span id="examfoot-count" class="examfoot-count"></span>
    <div class="examfoot-nav">
      <button id="examfoot-prev" type="button">Previous</button>
      <button id="examfoot-next" type="button">Next</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>renderQuiz();</script>

</body>
</html>
